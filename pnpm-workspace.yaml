packages:
    - 'apps/**/*'
    - 'apps/*'
    - '!apps/docs'
    - '!apps/sandbox'
    - 'lib/*'
    - 'packages/*'
    - 'packages/esbuild/*'
    - 'packages/eslint/*'
    - 'services'
    - '!packages/ui-kit'
allowBuilds:
    core-js-pure: true
    esbuild: true
    puppeteer: true
# Every override below forces a patched transitive that no direct-dependency
# bump can reach — all sit under the vercel 58.4.4 CLI, which pins them.
# Removal condition for each: drop it once a plain `pnpm install` resolves the
# named parent to a version inside the patched range (check with `pnpm why`).
# NOTE: tools that embed the legacy TypeScript compiler API are given their
# own nested typescript 6 via the readPackage hook in .pnpmfile.cjs — see the
# comment there for why neither overrides nor packageExtensions can do it.
overrides:
    # tar: GHSA-23hp-3jrh-7fpw (critical) + 8 more tar advisories.
    # @vercel/fun@1.3.0 pins tar 7.5.7; patched >=7.5.21.
    'tar@<7.5.21': ^7.5.22
    # undici: GHSA-vrm6-8vpv-qv8q, GHSA-v9p9-hfj2-hcw8, GHSA-vxpw-j846-p89q
    # (high) + 7 more. vercel/@vercel/blob pin 6.25.0; @vercel/node pins 5.28.4
    # and the high-severity fixes were only published on the 6.x line.
    'undici@<6.27.0': ^6.28.0
    # minimatch: GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74
    # (high). @vercel/python-analysis pins 10.1.1; patched >=10.2.3.
    'minimatch@>=10.0.0 <10.2.3': ^10.2.6
    # js-yaml: GHSA-52cp-r559-cp3m (high), GHSA-h67p-54hq-rp68 (moderate).
    # @vercel/python-analysis pins 3.15.1; patched >=4.3.0 only. It calls
    # yaml.load, which v4 keeps (as the safe loader), so the major jump holds.
    'js-yaml@<4.3.0': ^4.3.1
    # Collateral repair for the js-yaml jump above: read-yaml-file@1 (under
    # changesets' @manypkg/find-root) calls yaml.safeLoad, which js-yaml 4
    # removed — breaking the changesets CLI (`pnpm status-packages` and the
    # publish workflow). v2 calls yaml.load natively. Drop together with the
    # js-yaml override.
    'read-yaml-file@<2.0.0': ^2.1.0
    # path-to-regexp: GHSA-j3q9-mxjg-w52f (high), GHSA-27v5-c462-wpq7 (moderate).
    # @vercel/fun pins 8.2.0, @vercel/backends pins 8.3.0; patched >=8.4.0.
    'path-to-regexp@>=8.0.0 <8.4.0': ^8.4.2
    # brace-expansion: GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg (high).
    # minimatch@3 (under vercel's ts-morph) pins 1.1.14; patched >=1.1.17.
    'brace-expansion@>=1.0.0 <1.1.17': ^1.1.18
    # ajv: GHSA-2g4f-4pwh-qvx6 (moderate). @vercel/static-config pins 8.6.3;
    # patched >=8.18.0.
    'ajv@>=8.0.0 <8.18.0': ^8.20.0
    # smol-toml: GHSA-v3rj-xjv7-4jmq (moderate). vercel pins 1.5.2; patched >=1.6.1.
    'smol-toml@<1.6.1': ^1.7.1
    # @tootallnate/once: GHSA-vpq2-c234-7xj6 (low). @vercel/fun pins 2.0.0;
    # patched >=2.0.1.
    '@tootallnate/once@<2.0.1': ^2.0.1
