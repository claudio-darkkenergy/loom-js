name: Format Check

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    format-check:
        name: Format Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repo
              # https://github.com/actions/checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              # https://github.com/pnpm/action-setup
              uses: pnpm/action-setup@v3

            - name: Install Node.js 24.x
              # https://github.com/actions/setup-node
              # 24.x, not 20.x: prettier-plugin-sort-imports groups prefix-only
              # builtins (node:test) by the running Node's builtin list, so the
              # CI Node major must match the local dev baseline or --check
              # disagrees on files that import node:test.
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install

            # Fails on any unformatted file, and also on a broken formatter
            # (e.g. the import-sorting plugin resolving a TypeScript major it
            # cannot use — see openspec/changes/fix-prettier-import-sorting/).
            - name: Check Formatting
              run: pnpm format:check
