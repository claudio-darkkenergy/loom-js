name: Release

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            # changesets/action: push the version branch and open the Version PR
            contents: write
            pull-requests: write
            # npm trusted publishing (OIDC) — no NPM_TOKEN secret involved
            id-token: write
        # To use Turborepo Remote Caching, set the following environment variables for the job.
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}

        steps:
            - name: Checkout Repo
              # https://github.com/actions/checkout
              uses: actions/checkout@v4

            - name: Cache turbo
              # https://github.com/actions/cache
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-

            - name: Install pnpm
              # https://github.com/pnpm/action-setup
              uses: pnpm/action-setup@v3

            - name: Install Node.js 24.x
              # https://github.com/actions/setup-node
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: 'pnpm'

            # Trusted publishing needs npm >= 11.5.1; don't rely on the
            # runner's bundled npm staying new enough.
            - name: Upgrade npm for OIDC trusted publishing
              run: npm install -g npm@latest && npm --version

            # An existing ~/.npmrc stops changesets/action from writing one
            # with an (absent) NPM_TOKEN, which would shadow OIDC auth.
            # provenance=true attests the build; requires each package's
            # repository field to match this repo.
            - name: Configure npm for tokenless publish
              run: echo "provenance=true" > "$HOME/.npmrc"

            - name: Install Dependencies
              run: pnpm install

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              # https://github.com/changesets/action
              uses: changesets/action@v1
              with:
                  # This expects you to have a script called publish-package which does a build for your packages and calls changeset publish
                  publish: pnpm publish-packages
                  # version: pnpm version-packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # - name: Send a Slack notification if a publish happens
            # if: steps.changesets.outputs.published == 'true'
            # You can do something when a publish happens.
            # run: my-slack-bot send-notification --message "A new version of ${GITHUB_REPOSITORY} was published!"
